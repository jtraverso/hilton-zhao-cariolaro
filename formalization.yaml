version: "v0.4"

project:
  name: "Graphs whose core has maximum degree two: Hilton–Zhao structure and partial Cariolaro–Cariolaro"
  description: >-
    A Lean 4 / Mathlib formalization of results on finite simple graphs G whose core (the
    vertices of maximum degree Δ) has maximum degree at most two, stated as: every vertex of
    degree Δ has at most two neighbours of degree Δ. Hilton–Zhao (1992): if G is connected and not
    Δ-edge-colourable, then G − e is Δ-edge-colourable for every edge e, every vertex has at least
    two neighbours of degree Δ (so the core is 2-regular), and every vertex has degree at least
    Δ − 1, with equality somewhere when Δ ≥ 3 (hiltonZhao_critical, hiltonZhao_two_le,
    hiltonZhao_core_regular, hiltonZhao_min_degree, hiltonZhao_min_degree_eq); corollaries: class
    one when some vertex of degree Δ has at most one neighbour of degree Δ, or some vertex has
    degree at most Δ − 2. For Δ = 3: a connected class-two graph is a petal graph
    (Cariolaro–Cariolaro Lemma 3: degrees 2 or 3, the degree-3 vertices induce a 2-regular graph,
    degree-2 vertices have only degree-3 neighbours) and 3|E| = 4|V|; and if some component of the
    core carries no internal petal (no vertex of degree below 3 adjacent to two of its vertices)
    then G is 3-edge-colourable (Cariolaro–Cariolaro Lemma 7, for a single core cycle). The graph
    P* (Petersen minus a vertex) is defined on Fin 9, proved isomorphic to the Petersen graph minus
    a vertex, and shown to satisfy the hypotheses, to be connected, of class two and not overfull.
    The full Cariolaro–Cariolaro theorem (Δ = 3 and G ≠ P* imply class one) is NOT formalized: the
    case where every core cycle carries an internal petal remains. Vizing's theorem and Vizing's
    adjacency lemma are lake dependencies on PALOMAR-2026-10-15-000004 and
    PALOMAR-2026-11-04-000009; Kempe chains and their end-point lemma come from the former.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

