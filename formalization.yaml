status:
  scope: >-
    Hilton–Zhao 1992 structure lemma and corollaries; Cariolaro–Cariolaro Lemmas 3 and 7 (the
    latter for one core cycle); P*. Not formalized: Cariolaro–Cariolaro Theorems 1–2 in the case
    where every core cycle carries an internal petal; the Hilton–Zhao conjecture for Δ ≥ 4.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code (Anthropic)"
      tool_setup: >-
        Wrote the Lean development (CoreDeg2/), the Challenge/Solution pair and the packaging under
        the author's direction, checked with lean against the pinned dependencies, #print axioms
        and a comparison of the elaborated Challenge and Solution statements (pp.all)
        (Lean v4.35.0-rc3, Mathlib c55e6e786f49471c72fbddbec5415808896aec1e).
      cost:
        wall_time: "under a day"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "Natural-language instructions in Spanish, directed by the author."
  spend_usd: "subscription-based"
  notes: >-
    The results were chosen by the human author; the Lean development is AI-written under the
    author's direction and mechanically verified: no sorry, axioms limited to propext,
    Classical.choice and Quot.sound, identical elaborated statements in the Challenge and the
    Solution.

fidelity:
  divergences: >-
    Class one is G.lineGraph.Colorable G.maxDegree. "The core has maximum degree at most two" is
    stated vertex-wise (every vertex of degree Δ has at most two neighbours of degree Δ). The core
    component of r is reachability in fromRel (G-adjacency between vertices of degree Δ). "G is an
    odd cycle" in Hilton–Zhao item 3 is replaced by the hypothesis Δ ≥ 3. P* is a concrete graph on
    Fin 9 with a proved isomorphism to the Petersen graph minus a vertex.

review:
  status: "agent-reviewed"
  reviewers:
    - "Claude Opus 5.5 (AI agent in Claude Code, acting for the author)"
  notes: >-
    Agent review by Claude Opus 5.5, distinct from the mechanical verification: statements checked
    against the sources and on small cases (odd cycles: Δ = 2, every vertex has two Δ-neighbours;
    P*: satisfies all Δ = 3 conclusions, 3·12 = 4·9, and every core cycle carries internal
    petals, consistently with Lemma 7). No independent human review has been performed. The
    results are classical; no mathematical novelty is claimed.

